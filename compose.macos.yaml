services:
  # MARK: Development
  # macOS uses XQuartz on the host and software rendering in Docker Desktop.
  development:
    build:
      context: .
      dockerfile: docker/development.Dockerfile
      args:
        USERNAME: ${CONTAINER_USER:-embr}
        USER_UID: ${LOCAL_UID:-1000}
        USER_GID: ${LOCAL_GID:-1000}
    image: embr-bot:development
    container_name: embr-bot-development
    hostname: embr-development
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    stdin_open: true
    tty: true
    environment:
      - ROS_DOMAIN_ID=0
      - ROS_HOME=/tmp/ros
      - EMBR_REPO=/home/${CONTAINER_USER:-embr}/EMBR-AutoBot
      - EMBR_PHYS_WS=/home/${CONTAINER_USER:-embr}/EMBR-AutoBot/embr_phys/ros2_ws
      - DISPLAY=host.docker.internal:0.0
      - QT_QPA_PLATFORM=xcb
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=1
      - GALLIUM_DRIVER=llvmpipe
    volumes:
      - .:/home/${CONTAINER_USER:-embr}/EMBR-AutoBot:rw
    command: bash
