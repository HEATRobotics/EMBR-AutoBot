name: Secret scanning

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".env*"
      - "compose.*.yaml"
      - "docker/**"
      - ".github/workflows/**"
      - "scripts/ci/**"
  push:
    branches:
      - main
      - 'autonomy/EMBR-20/Autonomy-Tech-Stack'
    paths:
      - ".env*"
      - "compose.*.yaml"
      - "docker/**"
      - ".github/workflows/**"
      - "scripts/ci/**"
  workflow_dispatch:

jobs:
  secrets:
    name: Scan for API keys and secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan for API keys and secrets
        run: |
          set -euo pipefail
          # Narrow, deterministic set of high-value secret patterns. Intentionally
          # avoids fuzzy entropy matching so legitimate config never fails CI.
          patterns='sk-|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|xoxb-[A-Za-z0-9-]+|AIza[A-Za-z0-9_-]{35}|ssh-rsa|-----BEGIN'

          shopt -s nullglob
          scan_targets=(.env* compose.*.yaml docker/ scripts/ci/)
          existing_targets=()
          for target in "${scan_targets[@]}"; do
            if [ -e "${target}" ]; then
              existing_targets+=("${target}")
            fi
          done

          if [ "${#existing_targets[@]}" -eq 0 ]; then
            echo "[PASS] No scannable files found."
            exit 0
          fi

          matches="$(grep -rEIn --exclude-dir=.git -e "$patterns" "${existing_targets[@]}" 2>/dev/null || true)"
          if [ -n "${matches}" ]; then
            echo "[FAIL] Possible API key or secret detected in environment/compose/docker/CI files:" >&2
            printf '%s\n' "${matches}" >&2
            exit 1
          fi
          echo "[PASS] No API keys or secrets found in environment files, compose files, docker/, or CI scripts."