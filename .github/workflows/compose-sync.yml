name: desktop compose sync

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "compose.*.yaml"
      - "docker/**"
      - ".github/workflows/compose-sync.yml"
      - "scripts/ci/**"
      - "scripts/environment/setup_native_ubuntu.sh"
      - "scripts/environment/ubuntu-packages.txt"
      - "embr_phys/ros2_ws/src/**"
      - "embr_autonomy/ros2_ws/src/**"
  push:
    branches:
      - main
    paths:
      - "compose.*.yaml"
      - "docker/**"
      - ".github/workflows/compose-sync.yml"
      - "scripts/ci/**"
      - "scripts/environment/setup_native_ubuntu.sh"
      - "scripts/environment/ubuntu-packages.txt"
      - "embr_phys/ros2_ws/src/**"
      - "embr_autonomy/ros2_ws/src/**"
  workflow_dispatch:

jobs:
  parity:
    name: Check compose file parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compare services declared across compose.*.yaml
        run: ./scripts/ci/check_compose_parity.sh


  ros-domain-id:
    name: Check ROS_DOMAIN_ID conflicts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ROS_DOMAIN_ID conflicts between development and autonomy
        run: |
          python3 - <<'PYEOF'
          import re, sys, glob
          failed = False
          for file in sorted(glob.glob("compose.*.yaml")):
              text = open(file).read()
              # Split on service definitions to find blocks
              parts = re.split(r'\n(\w+):', text)
              current_service = None
              env_vals = {}
              for part in parts:
                  if re.match(r'^[a-zA-Z_][a-zA-Z0-9_]*$', part):
                      current_service = part
                  elif current_service in ('development', 'autonomy'):
                      m = re.search(r'- ROS_DOMAIN_ID=(\S+)', part)
                      if m:
                          env_vals[current_service] = m.group(1).strip('"').strip("'")
              if 'development' in env_vals and 'autonomy' in env_vals:
                  if env_vals['development'] == env_vals['autonomy']:
                      print(f"[FAIL] {file}: development and autonomy share ROS_DOMAIN_ID={env_vals['development']}", file=sys.stderr)
                      failed = True
          if failed:
              sys.exit(1)
          print("[PASS] No ROS_DOMAIN_ID conflicts between development and autonomy services.")
          PYEOF
  smoke-test:
    name: Build & start services (${{ matrix.compose_file }})
    needs: parity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compose_file:
          - compose.windows.yaml
          - compose.macos.yaml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare .env
        run: cp .env.example .env

      - name: Build and smoke-start every active service
        run: ./scripts/ci/compose_smoke_test.sh "${{ matrix.compose_file }}"
