services:

  # MARK: CANopen
  # ROS 2 CANopen simulation with the physical description as an underlay.
  #
  # Windows notes (Docker Desktop, WSL2 backend):
  #   - There is no host X11 socket to bind-mount. Run an X server on the
  #     Windows host (e.g. VcXsrv) with access control disabled and this
  #     service points GUI apps at it via DISPLAY. See
  #     documentation/canopen_simulation.md for setup steps.
  #   - `network_mode: host` and raw `/dev/dri` GPU device passthrough are
  #     Linux Docker Engine features with no Docker Desktop equivalent, so
  #     this service uses the default bridge network and Mesa software
  #     rendering instead of a passed-through GPU.
  #   - SocketCAN's `vcan` kernel module is not present in the default WSL2
  #     kernel. `CAN_INTERFACE` will not come up without a custom WSL2
  #     kernel build. `cap_add: NET_ADMIN` is kept for parity with the Linux
  #     service and for hosts that do have `vcan` support.
  canopen-sim:
    build:
      context: .
      dockerfile: docker/CANopen-Spec-Dockerfile
      args:
        USERNAME: ${CONTAINER_USER:-embr}
        USER_UID: ${LOCAL_UID:-1000}
        USER_GID: ${LOCAL_GID:-1000}
    image: embr-bot:canopen-sim
    container_name: embr-bot-canopen-sim
    hostname: embr-canopen-sim
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"

    stdin_open: true
    tty: true

    # Allows the container to create/configure vcan0 when the host kernel
    # supports it (see the Windows notes above).
    cap_add:
      - NET_ADMIN

    environment:
      - ROS_DOMAIN_ID=0
      - EMBR_PHYS_WS=/workspace/embr_phys_ws
      - EMBR_SIM_WS=/workspace/embr_sim_ws
      - CAN_INTERFACE=${CAN_INTERFACE:-vcan0}
      - DISPLAY=${DISPLAY:-host.docker.internal:0.0}
      - QT_QPA_PLATFORM=xcb
      - QT_X11_NO_MITSHM=1
      # VcXsrv does not reliably support indirect GLX/DRI acceleration for
      # OGRE (RViz) or Gazebo, so fall back to Mesa software rendering.
      - LIBGL_ALWAYS_SOFTWARE=1
      - GALLIUM_DRIVER=llvmpipe

    volumes:
      - ./embr_phys/ros2_ws:/workspace/embr_phys_ws:rw
      - ./embr_sim/ros2_ws:/workspace/embr_sim_ws:rw

    # Docker Desktop already resolves host.docker.internal for Windows
    # hosts; the explicit mapping keeps this file runnable unchanged on
    # plain Linux Docker Engine (used by CI) too.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    command: bash

