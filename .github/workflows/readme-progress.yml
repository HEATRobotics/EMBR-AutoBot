name: Update README timeline

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-progress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Generate timeline
        run: python3 scripts/documentation/update_progress.py
      - name: Commit updated image
        run: |
          git add README.md documentation/assets/academic-year-progress.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update academic-year timeline"
          git push
